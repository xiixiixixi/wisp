<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wisp 真实截图排版</title>
  <style>
    :root { color-scheme: light; --page: #f7f9fb; --text: #23303e; --muted: #617184; --line: #d9e1e8; --slate: #25374b; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: var(--page); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; }
    .preview-header, .preview-body { width: min(1080px, calc(100% - 48px)); margin: 28px auto; }
    .preview-header h1 { margin: 0 0 8px; font-size: 20px; line-height: 1.3; font-weight: 600; }
    .preview-header p { margin: 0 0 16px; color: var(--muted); }
    .preview-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    select, button { padding: 8px 11px; font: inherit; color: inherit; background: #fff; border: 1px solid var(--line); border-radius: 5px; }
    select { min-width: 230px; }
    button { cursor: pointer; }
    a { color: #285878; text-decoration: none; }
    a:hover { text-decoration: underline; }
    :focus-visible { outline: 2px solid #1c6ac9; outline-offset: 3px; }
    #source-note { margin: 12px 0 0; font-size: 13px; }
    .composition { width: 100%; padding: 2.2%; overflow: hidden; background: var(--slate); border-radius: 0; }
    .composition[data-layout="side-by-side"] { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--composition-gap, 1.6%); }
    .composition[data-background="cool-gray"] { background: #e7edf3; }
    .composition[data-background="cool-gray"] .screenshot-frame { box-shadow: 0 7px 20px rgba(28, 47, 67, .17), 0 1px 4px rgba(28, 47, 67, .11); }
    .screenshot-frame { position: relative; width: 100%; margin: 0; padding: 0; overflow: hidden; border-radius: 0; background: transparent; box-shadow: 0 12px 30px rgba(3, 12, 25, .28), 0 1px 4px rgba(3, 12, 25, .2); }
    .screenshot-frame img { display: block; width: 100%; height: auto; max-width: none; border: 0; border-radius: 0; filter: none; }
    .screenshot-frame[data-cropped="true"] img { position: absolute; top: 0; left: 0; height: auto; }
    .preview-note { margin: 12px 0 0; color: var(--muted); font-size: 12px; }
    .render-error { margin: 0; padding: 18px; color: #9e261e; background: #fff2ee; white-space: pre-wrap; }
    body.capture { background: transparent; }
    body.capture .preview-header, body.capture .preview-note { display: none; }
    body.capture .preview-body { width: auto; margin: 0; }
    body.capture .composition { width: var(--capture-width); padding: var(--capture-padding); }
    @media (max-width: 640px) { .preview-header, .preview-body { width: calc(100% - 24px); } select { width: 100%; } }
  </style>
</head>
<body>
  <header class="preview-header">
    <h1>真实截图排版</h1>
    <p>主图并排展示真实浅色与深色截图；其他功能图保留单张矩形画面。成图没有文字、圆圈或渐变。</p>
    <div class="preview-controls">
      <label for="screenshot-selector">截图</label>
      <select id="screenshot-selector"></select>
      <button id="refresh" type="button">读取最新配置</button>
      <a id="capture-link" href="#">打开仅截图画面</a>
    </div>
    <p id="source-note"></p>
  </header>
  <main class="preview-body">
    <div class="composition" data-theme="slate"><figure class="screenshot-frame"><img alt="Wisp 真实截图" decoding="sync"></figure></div>
    <p class="preview-note">截取仅截图画面中的矩形容器；此处的预览标题和说明不会进入成图。</p>
  </main>
  <script id="page-config" type="application/json">__CONFIG__</script>
  <script>
    const config = JSON.parse(document.getElementById('page-config').textContent);
    const params = new URLSearchParams(location.search);
    const captureMatch = location.pathname.match(/^\/capture\/([a-z0-9-]+)\/slate$/);
    const configured = config.screenshots.filter(shot => shot.path || shot.images?.length);
    const assetId = captureMatch?.[1] || params.get('asset') || configured[0]?.id;
    const selected = configured.find(shot => shot.id === assetId);
    const selector = document.getElementById('screenshot-selector');
    window.__WISP_CAPTURE_READY__ = false;
    for (const shot of configured) selector.append(new Option(shot.title, shot.id, false, shot.id === assetId));
    selector.addEventListener('change', () => { location.href = '/?asset=' + encodeURIComponent(selector.value); });
    document.getElementById('refresh').addEventListener('click', () => location.reload());
    const fail = error => {
      const note = document.createElement('p');
      note.className = 'render-error'; note.textContent = error.message;
      document.querySelector('main').prepend(note);
      window.__WISP_CAPTURE_ERROR__ = error.message;
    };
    if (!selected) {
      fail(new Error('此截图尚未配置，请填写实际图片路径。'));
    } else {
      document.getElementById('source-note').textContent = selected.note || '';
      document.getElementById('capture-link').href = '/capture/' + selected.id + '/slate';
      const outputWidth = Number(params.get('width')) || selected.outputWidth || config.outputWidth || 1600;
      const paddingRatio = selected.paddingRatio ?? config.paddingRatio ?? .022;
      const padding = Math.round(outputWidth * paddingRatio);
      document.documentElement.style.setProperty('--capture-width', outputWidth + 'px');
      document.documentElement.style.setProperty('--capture-padding', padding + 'px');
      const composition = document.querySelector('.composition');
      composition.dataset.background = selected.background || 'slate';
      if (selected.layout === 'side-by-side') {
        composition.dataset.layout = 'side-by-side';
        composition.style.setProperty('--composition-gap', ((selected.gapRatio ?? .016) * 100) + '%');
      }
      if (captureMatch) {
        document.body.classList.add('capture');
        document.title = selected.title + ' · 真实截图';
      } else {
        composition.style.padding = (paddingRatio * 100) + '%';
      }
      composition.replaceChildren();
      const imageSources = selected.images || [selected];
      const loadedImages = imageSources.map((source, index) => new Promise((resolve, reject) => {
        const frame = document.createElement('figure');
        frame.className = 'screenshot-frame';
        const img = document.createElement('img');
        img.alt = (source.title || selected.title) + '，真实应用截图';
        img.decoding = 'sync';
        frame.append(img);
        composition.append(frame);
        img.onload = () => {
          try {
            const crop = source.crop;
            if (crop) {
              if (crop.x + crop.width > img.naturalWidth || crop.y + crop.height > img.naturalHeight) throw new Error('裁切坐标超出了真实截图范围。');
              frame.dataset.cropped = 'true';
              frame.style.aspectRatio = crop.width + ' / ' + crop.height;
              img.style.width = (img.naturalWidth / crop.width * 100) + '%';
              img.style.left = (-crop.x / crop.width * 100) + '%';
              img.style.top = (-crop.y / crop.height * 100) + '%';
            }
            resolve();
          } catch (error) { reject(error); }
        };
        img.onerror = () => reject(new Error('截图加载失败，请检查配置路径。'));
        img.src = '/media/' + selected.id + (selected.images ? '/' + index : '') + '?t=' + Date.now();
      }));
      Promise.all(loadedImages).then(async () => {
        await document.fonts.ready;
        window.__WISP_CAPTURE_SIZE__ = { width: composition.offsetWidth, height: composition.offsetHeight };
        window.__WISP_CAPTURE_READY__ = true;
      }).catch(fail);
    }
  </script>
</body>
</html>
