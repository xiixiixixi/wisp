<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Wisp</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <script>
    // Always light — the ink polarity was removed (2026-09-06). SkySync
    // re-applies theme-light plus the fluid/accessibility classes on boot.
    try {
      document.documentElement.classList.add('theme-light');
    } catch (e) {}
  </script>
  <body>
    <div
      id="root"
      style="
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      "
    ></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
