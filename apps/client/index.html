<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Wisp</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <script>
    // Match SkySync's appearance resolution before React loads to avoid a flash.
    var appearance = 'system';
    try {
      var savedAppearance = JSON.parse(localStorage.getItem('wisp:settings'))?.appearance;
      if (savedAppearance === 'light' || savedAppearance === 'dark') appearance = savedAppearance;
    } catch (e) {}
    var systemDark = false;
    try {
      systemDark = matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) {}
    var darkAppearance = appearance === 'dark' || (appearance === 'system' && systemDark);
    document.documentElement.dataset.wispAppearance = appearance;
    document.documentElement.classList.add(
      darkAppearance ? 'theme-rolex' : 'theme-light',
      'theme-fluid',
    );
  </script>
  <body>
    <div
      id="root"
      style="
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      "
    ></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
