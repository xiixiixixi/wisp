packages:
  - 'apps/client'
  - 'apps/web'
  - 'packages/sdk'
  - 'packages/extension-sdk'
  - 'packages/create-extension'
  - 'packages/cli'
  - 'packages/extensions/**'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - sharp
